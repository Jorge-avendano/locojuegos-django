{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="container py-5 my-5 d-flex justify-content-center align-items-center">
    <div class="card bg-dark text-light border-secondary h-100" style="max-width: 450px; width: 100%;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4 fw-bold">Crea tu Cuenta</h3>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                
                <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">Registrarme</button>
            </form>
            
            <div class="text-center mt-3">
                <p class="text-muted small">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-info text-decoration-none">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
