{% extends 'base.html' %}
{% load static %}

{% block contenido %}

<div class="container py-5 my-5 flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="card bg-dark text-light border-secondary h-100" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4 fw-bold">Iniciar Sesión</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    {{ form.as_p}}
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
                <div class="text-center mt-3">
                    <p class="text-muted small">¿Eres nuevo en Locojuegos? <a href="{% url 'registro' %}" class="text-warning text-decoration-none">Crea una cuenta</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
